name: Build and Push Docker Image

# কখন এই অ্যাকশনটি চলবে
on:
  push:
    branches:
      - main  # আপনার মেইন ব্রাঞ্চের নাম 'master' হলে এখানে master দিন

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ১. গিটহাব থেকে কোড চেকআউট করা
      - name: Checkout code
        uses: actions/checkout@v4

      # ২. ডকার হাবে লগইন করা (আপনার সেট করা সিক্রেট ব্যবহার করে)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: puremahadi
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ৩. ডকার ইমেজ বিল্ড এবং পুশ করা
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # এখানে 'my-app' এর জায়গায় আপনার ইমেজের নাম দিন
          tags: puremahadi/my-app:latest 

      # ৪. (ঐচ্ছিক) সাকসেস মেসেজ
      - name: Image digest
        run: echo ${{ steps.build-and-push.outputs.digest }}